# CI-only provider override. This file is never part of a production deployment.
x-ci-model-environment: &ci-model-environment
  BRAINPAT_TOKEN: ${BRAINPAT_TOKEN:?BRAINPAT_TOKEN is required}
  LLM_PROVIDER: amazon_bedrock
  LLM_MODEL: claude-haiku-5-5
  LLM_SMALL_PROVIDER: amazon_bedrock
  LLM_LARGE_PROVIDER: amazon_bedrock
  LLM_REQUIRE_HAIKU: "true"
  BEDROCK_REGION: us-east-1
  BEDROCK_INFERENCE_PROFILE: us
  BEDROCK_SMALL_LLM_MODEL: us.anthropic.claude-haiku-5-5
  BEDROCK_LARGE_LLM_MODEL: us.anthropic.claude-haiku-5-5
  BEDROCK_ENDPOINT_URL: http://embedding-stub:8080
  AWS_ACCESS_KEY_ID: ci-isolated-token
  AWS_SECRET_ACCESS_KEY: ci-isolated-token
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  EMBEDDINGS_PROVIDER: openai
  OPENAI_API_KEY: ci-isolated-token
  OPENAI_BASE_URL: http://embedding-stub:8080/v1
  SEARCH_ENABLED: "true"
  SEARCH_USE_DENSE: "true"
  SEARCH_USE_BM25: "false"
  CONTEXT_PASSAGE_MODE: dense

services:
  embedding-stub:
    image: python:3.11.14-slim-bookworm
    command: [python, /stub.py]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../scripts/openai_ci_stub.py:/stub.py:ro
    networks: [appnet]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 10

  brainapi:
    environment: *ci-model-environment
    depends_on:
      embedding-stub: {condition: service_healthy}

  brainapi-worker:
    environment: *ci-model-environment
    depends_on:
      embedding-stub: {condition: service_healthy}

  brainapi-mcp:
    environment: *ci-model-environment
    depends_on:
      embedding-stub: {condition: service_healthy}
